services:
  secure-linux:
    build:
      context: .
      dockerfile: Dockerfile.secure-linux
    container_name: secure-linux
    hostname: secure-linux
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
      - AUDIT_CONTROL
      - AUDIT_READ
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor:docker-default
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m
      - /run:noexec,nosuid,nodev,size=50m
    volumes:
      - secure-data:/home/secuser/data
      - ./logs:/var/log/security:rw
      - /etc/localtime:/etc/localtime:ro
    networks:
      - security-net
    healthcheck:
      test: ["CMD", "pgrep", "-x", "bash"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - security-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - security-net
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
    depends_on:
      - prometheus

  trivy:
    image: aquasec/trivy:latest
    container_name: trivy
    security_opt:
      - no-new-privileges:true
    volumes:
      - trivy-cache:/root/.cache/trivy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp:size=500m
    networks:
      - security-net
    command:
      - server
      - --listen
      - "0.0.0.0:8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

networks:
  security-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  secure-data:
  prometheus-data:
  grafana-data:
  trivy-cache:
