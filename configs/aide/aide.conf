# Database locations
database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
database_new=file:/var/lib/aide/aide.db.new

# Gzip output
gzip_dbout=yes

# Report settings
report_url=file:/var/log/aide/aide.log
report_url=stdout

# Verbose level (0-255)
verbose=5

# Rule definitions
# p: permissions
# i: inode
# n: number of links
# u: user
# g: group
# s: size
# b: block count
# m: mtime
# a: atime
# c: ctime
# S: check for growing size
# md5: md5 checksum
# sha256: sha256 checksum
# sha512: sha512 checksum

# Predefined rule sets
NORMAL = p+i+n+u+g+s+m+c+md5+sha256
DIR = p+i+n+u+g
PERMS = p+i+u+g
LOG = p+u+g+i+n+S
LSPP = p+i+n+u+g+s+m+c+md5+sha256
DATAONLY = p+n+u+g+s+md5+sha256

# ============================================
# CRITICAL SYSTEM BINARIES
# ============================================

/bin NORMAL
/sbin NORMAL
/usr/bin NORMAL
/usr/sbin NORMAL
/usr/local/bin NORMAL
/usr/local/sbin NORMAL

# ============================================
# LIBRARIES
# ============================================

/lib NORMAL
/lib64 NORMAL
/usr/lib NORMAL
/usr/lib64 NORMAL

# ============================================
# CONFIGURATION FILES
# ============================================

/etc NORMAL

# Special handling for frequently changing files
!/etc/mtab
!/etc/adjtime
!/etc/motd
!/etc/ld.so.cache

# PAM configuration
/etc/pam.d NORMAL
/etc/security NORMAL

# SSH configuration
/etc/ssh NORMAL

# Security configuration
/etc/sysctl.conf NORMAL
/etc/sysctl.d NORMAL
/etc/apparmor.d NORMAL
/etc/audit NORMAL
/etc/sudoers NORMAL
/etc/sudoers.d NORMAL

# ============================================
# KERNEL AND BOOT
# ============================================

/boot NORMAL
!/boot/grub/grubenv

# ============================================
# USER FILES
# ============================================

/root NORMAL
!/root/.bash_history
!/root/.viminfo

/home DIR
!/home/*/.bash_history
!/home/*/.viminfo

# ============================================
# LOGS (Monitor for tampering)
# ============================================

/var/log LOG
!/var/log/lastlog
!/var/log/wtmp
!/var/log/btmp

# ============================================
# SYSTEM STATE
# ============================================

!/var/run
!/var/lock
!/var/cache
!/var/tmp
!/var/lib/apt
!/var/lib/dpkg/lock
!/var/lib/dpkg/lock-frontend
!/var/lib/dpkg/triggers

# ============================================
# PROC AND SYS (VIRTUAL FILESYSTEMS)
# ============================================

!/proc
!/sys
!/dev

# ============================================
# TEMPORARY FILES
# ============================================

!/tmp
!/var/tmp
